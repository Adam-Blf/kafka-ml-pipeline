# Kafka local, prêt à l'emploi pour les TP.
#
#   docker compose up -d --wait      # attend que le broker soit vraiment prêt
#   docker compose down              # arrête et supprime
#
# Puis dans les scripts : bootstrap_servers="localhost:9092"
# Si ça timeout, essayer "127.0.0.1:9092" : selon la machine, localhost peut
# résoudre en IPv6 alors que le port n'est publié qu'en IPv4.

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka-tp
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      # --- Mode KRaft : pas de ZooKeeper, un seul conteneur ---------------
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      # --- Le réglage qui cause 90 % des timeouts -------------------------
      # LISTENERS dit sur quoi le broker écoute. ADVERTISED_LISTENERS dit
      # quelle adresse il DONNE au client pour le recontacter. Si cette
      # seconde adresse n'est pas joignable depuis la machine hôte, le client
      # se connecte une première fois, reçoit une adresse interne, puis
      # timeoute sans message d'erreur utile.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      # --- Réplication à 1 : un seul broker, donc pas de réplique ---------
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Sans ce zéro, le premier consumer d'un groupe attend trois secondes
      # avant de recevoir quoi que ce soit, ce qui ressemble à un blocage.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Deux partitions par défaut : demandé par l'exercice bonus, et
      # nécessaire pour voir un consumer group répartir la charge.
      KAFKA_NUM_PARTITIONS: 2

    # Un conteneur "Up" n'est pas un broker prêt. La sonde interroge vraiment
    # l'API, ce qui permet à `up -d --wait` de rendre la main au bon moment.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s
